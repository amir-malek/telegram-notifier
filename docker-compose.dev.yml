version: '3.8'

services:
  # Development services only (no app container)

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: notification-postgres-dev
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=notification_service
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres123
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./scripts/migrations:/docker-entrypoint-initdb.d
    networks:
      - notification-dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notification_service"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: notification-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass redis123 --appendonly yes
    volumes:
      - redis_dev_data:/data
    networks:
      - notification-dev-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL Admin (Optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: notification-pgadmin-dev
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@notification.local
      - PGADMIN_DEFAULT_PASSWORD=admin123
      - PGADMIN_CONFIG_SERVER_MODE=False
    volumes:
      - pgadmin_dev_data:/var/lib/pgadmin
    networks:
      - notification-dev-network
    profiles:
      - admin
    depends_on:
      postgres:
        condition: service_healthy

  # Redis Admin (Optional)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: notification-redis-commander-dev
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=redis:redis:6379:0:redis123
      - HTTP_USER=admin
      - HTTP_PASSWORD=admin123
    networks:
      - notification-dev-network
    profiles:
      - admin
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_dev_data:
    driver: local
  redis_dev_data:
    driver: local
  pgadmin_dev_data:
    driver: local

networks:
  notification-dev-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16